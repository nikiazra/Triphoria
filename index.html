function sendF(){const n=$('fn').value.trim(),m=$('fm').value.trim();if(!n||!m){$('fo').innerHTML='<p>Mohon isi nama dan pesan.</p>';return}window.open(wa(`Halo Triphoria, saya ${n} (${$('fe').value}). ${m}`),'_blank');$('fo').innerHTML='<span class="ok">Membuka WhatsApp...</span>'}
/* Admin */
const lg=()=>sessionStorage.getItem('adm')==='1';
const gp=p=>p.split('.').reduce((o,k)=>o[k],D);
const par=p=>{const k=p.split('.'),l=k.pop();return[k.length?gp(k.join('.')):D,l]};
const blank=v=>Array.isArray(v)?[]:typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,blank(x)])):'';
const ed=(v,p)=>Array.isArray(v)?`<div>${v.map((x,i)=>`<div class="it"><button class="del" data-del="${p}.${i}">Hapus</button>${ed(x,p+'.'+i)}</div>`).join('')}<button class="add" data-add="${p}">+ Tambah</button></div>`:v&&typeof v==='object'?Object.keys(v).map(k=>`<label>${k}</label>${ed(v[k],p+'.'+k)}`).join(''):/(^|\.)(gambar|heroVideo|videoUrl)$/.test(p)?up(v,p):(String(v).length>70?`<textarea rows="3" data-p="${p}">${E(v)}</textarea>`:`<input data-p="${p}" value="${E(v)}">`);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('triphoria',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async f=>{const d=await idb(),k='v'+Date.now();await new Promise((res,rej)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(f,k);t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)});return k};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('v').objectStore('v').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const vsrc=s=>s&&s.startsWith('idb:')?`data-idb="${s.slice(4)}"`:`src="${s}"`;
function hydrate(){document.querySelectorAll('video[data-idb]').forEach(async v=>{try{const b=await idbGet(v.dataset.idb);if(b)v.src=URL.createObjectURL(b)}catch(e){}})}
function exportSite(){let vid=false;const seed=JSON.parse(JSON.stringify(D),(k,v)=>{if(typeof v==='string'&&v.startsWith('idb:')){vid=true;return ''}return v});
let html='<!DOCTYPE html>\n<html lang="id">'+document.documentElement.innerHTML+'</html>';
html=html.replace(/<script id="seed">[\s\S]*?<\/script>/,'').replace('<script id="main">',()=>'<script id="seed">window.__SEED='+JSON.stringify(seed).replace(/</g,'\\u003c')+'<\/script><script id="main">');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();
alert('File index.html sudah diunduh. Seret file itu ke Netlify (Deploys → drag & drop) agar semua pengunjung melihat perubahan.'+(vid?'\n\nCatatan: video yang diunggah tidak ikut terbawa (hanya tersimpan di browser ini), jadi perlu dipasang ulang.':''))}
const up=(v,p)=>`<div><input type="file" accept="${/(heroVideo|videoUrl)$/.test(p)?'video/*':'image/*'}" data-up="${p}">${v?`<small>✔ terpasang</small> <button class="del" style="float:none" data-clr="${p}">Hapus</button>`:'<small>kosong (maks video 10 MB)</small>'}</div>`;
document.addEventListener('change',e=>{const p=e.target.dataset?.up,f=e.target.files?.[0];if(!p||!f)return;const k=[...document.querySelectorAll('details')].map(d=>d.open);const done=s=>{const[o,l]=par(p),old=o[l];o[l]=s;if(!save()){o[l]=old;return}route();rest(k)};
if(f.type.startsWith('video')){if(f.size>10*1024*1024){alert('Video maksimal 10 MB.');return}idbPut(f).then(k=>done('idb:'+k)).catch(()=>alert('Gagal menyimpan video. Ruang penyimpanan browser mungkin penuh.'))}else{const im=new Image;im.onload=()=>{const s=Math.min(1,1100/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.75))};im.src=URL.createObjectURL(f)}});
const NAMA={media:'Video Utama & Banner',b:'Info Perusahaan & Kontak',home:'Beranda',about:'Tentang Kami',layanan:'Layanan',porto:'Portofolio & Testimoni',blog:'Artikel / Berita',dest:'Destinasi Populer (tipe: beach / mountain / temple / city)',pimpin:'Struktur Pimpinan',admin:'Akun Admin'};
function admin(){if(!lg())return hd('Login Admin','Khusus pengelola website')+`<section><div class="w" style="max-width:420px"><div class="c"><label>Username</label><input id="lu"><label>Password</label><input id="lp" type="password"><button class="btn s" onclick="doLogin()">Masuk</button><div id="le" style="color:#d9534f"></div></div></div></section>`;
return hd('Panel Admin','Ubah isi website — tersimpan otomatis')+`<div class="w adm"><p><small>Setelah selesai mengedit, klik "Simpan & Unduh Website", lalu upload file index.html ke Netlify agar tampil ke semua pengunjung.</small></p><p><button class="add" onclick="exportSite()">⬇ Simpan & Unduh Website</button> <button class="add" onclick="sessionStorage.removeItem('adm');route()">Logout</button> <button class="del" style="float:none;padding:8px 14px" onclick="if(confirm('Kembalikan semua data ke awal?')){D=structuredClone(DEF);save();route()}">Reset Data</button></p>${Object.keys(NAMA).map(k=>`<details class="sec"><summary>${NAMA[k]}</summary><div class="in">${ed(D[k],k)}</div></details>`).join('')}</div>`}
function doLogin(){if($('lu').value===D.admin.user&&$('lp').value===D.admin.pass){sessionStorage.setItem('adm','1');route()}else $('le').textContent='Username atau password salah.'}
document.addEventListener('input',e=>{const p=e.target.dataset?.p;if(p){const[o,k]=par(p);o[k]=e.target.value;save();chrome()}});
document.addEventListener('click',e=>{const t=e.target,op=document.querySelectorAll('details[open]');const keep=[...document.querySelectorAll('details')].map(d=>d.open);
if(t.dataset.clr){const[o,k]=par(t.dataset.clr);o[k]='';save();route();rest(keep)}
if(t.dataset.del){const[o,k]=par(t.dataset.del);o.splice(+k,1);save();route();rest(keep)}
if(t.dataset.add){const a=gp(t.dataset.add);a.push(a.length?blank(a[0]):'');save();route();rest(keep)}});
const rest=k=>document.querySelectorAll('details').forEach((d,i)=>d.open=k[i]);
function chrome(){$('nv').innerHTML=M.map(([h,l])=>`<a href="#/${h}" data-h="${h}">${l}</a>`).join('');$('wab').href=wa();
$('ft').innerHTML=`<b style="color:#fff;font-size:18px">✈ ${E(D.b.nama)}</b><p>${E(D.b.tagline)}</p><p>📍 ${E(D.b.alamat)} · ✉️ ${E(D.b.email)} · 📞 ${E(D.b.telp)}</p><p>© ${new Date().getFullYear()} ${E(D.b.nama)}. Hak cipta dilindungi. · <a href="#/admin">Admin</a></p>`}
function route(){const h=(location.hash.replace(/^#\/?/,'')||'');const [b,arg]=h.split('/');const pg=b==='admin'?admin:P[b]||P[''];$('app').innerHTML=pg(arg);hydrate();chrome();$('nv').classList.remove('o');
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.h===b));document.title=(b?M.find(m=>m[0]===b)?.[1]||'Admin':'Beranda')+' | Triphoria';scrollTo(0,0)}
$('bg').onclick=()=>$('nv').classList.toggle('o');
addEventListener('hashchange',route);route();
</script></body></html>
